name: Backend Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ml.txt -r requirements-assistant.txt

      - name: Run tests
        env:
          SCAMSHIELD_JWT_SECRET_KEY: ci-jwt-secret-key-that-is-long-enough-for-tests
          SCAMSHIELD_DATABASE_URL: postgresql+psycopg://scamshield:change_me_dev_password@localhost:5432/scamshieldai
        run: pytest