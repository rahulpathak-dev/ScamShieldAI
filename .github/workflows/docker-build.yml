name: Docker Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config

      - name: Build API image
        run: docker build -t scamshieldai-api:ci apps/api

      - name: Build web image
        run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000 -t scamshieldai-web:ci apps/web