name: Formatting

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  formatting:
    name: Formatting checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax check
        run: python -m compileall apps/api backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier@3 --check "**/*.{js,jsx,ts,tsx,json,md,yml,yaml,css}"